services:
 postgres:
  image: postgres:16
  environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
  ports: ["5432:5432"]
  volumes: ["pgdata:/var/lib/postgresql/data","./postgres-init:/docker-entrypoint-initdb.d"]
 inventory-service:
  build: {context: ., dockerfile: inventory-service/Dockerfile}
  environment: {DB_HOST: postgres}
  depends_on: [postgres]
  ports: ["8081:8081"]
 order-service:
  build: {context: ., dockerfile: order-service/Dockerfile}
  environment: {INVENTORY_URL: http://inventory-service:8081}
  depends_on: [inventory-service]
  ports: ["8082:8082"]
volumes: {pgdata: {}}
